name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v0.1.0
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to publish alongside latest
        required: true
        type: string

concurrency:
  group: publish-docker-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && inputs.release_tag == '' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve release version
        id: release
        shell: bash
        env:
          CALLED_VERSION: ${{ inputs.release_tag }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version=""
          if [[ -n "$CALLED_VERSION" ]]; then
            release_version="$CALLED_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_version="$GITHUB_REF_NAME"
          elif [[ -n "$MANUAL_VERSION" ]]; then
            release_version="$MANUAL_VERSION"
          fi
          if [[ -n "$release_version" ]]; then
            [[ "$release_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid release version: $release_version" >&2
              exit 1
            }
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=tip,enable=${{ steps.release.outputs.version == '' }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
